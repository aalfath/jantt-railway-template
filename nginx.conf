# Two workers are plenty for a static app; "auto" would start one per host CPU
# (Railway hosts show 32+ CPUs inside a 1 vCPU service).
user  nginx;
worker_processes  2;
error_log  /dev/stderr warn;
pid        /run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout  65;
    server_tokens off;

    map $request_uri $loggable {
        /healthz 0;
        default  1;
    }
    log_format  main  '$http_x_forwarded_for "$request" $status $body_bytes_sent "$http_user_agent"';
    access_log  /dev/stdout main if=$loggable;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    include /etc/nginx/conf.d/*.conf;
}
